# ===== Server =====
server.port=${PORT:8080}

# ===== MySQL Database =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticket_booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== CORS =====
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===== JWT =====
jwt.secret=${JWT_SECRET:ticketbookingsecretkeyticketbookingsecretkey123456}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ===== Email OTP - optional; app logs OTP when mail is not configured =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== OTP Config =====
otp.expiry.minutes=5

# ===== Swagger =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
